# Codex CLI Project Configuration
# This file enables project-specific Codex settings

# Default model configuration
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"

# Web search
web_search = "live"

# Approval policy
approval_policy = "never"

# Sandbox mode: default to workspace-write so Codex can edit files without
# a caller needing to pass --sandbox on every invocation. Writes are still
# confined to the workspace; network access stays disabled (do not add a
# network_access key to enable it). Planning/review consultations should
# still pass an explicit `--sandbox read-only` flag. Completion verification
# (Sol Guardrails, .agents/AGENTS.md section 8) remains mandatory regardless
# of sandbox mode.
sandbox_mode = "workspace-write"

# Feature toggles
[features]
skills = true

# Skills configuration - enable project skills
[[skills.config]]
enabled = true
path = ".codex/skills/context-loader"

[[skills.config]]
enabled = true
path = ".codex/skills/design-tracker"

# Response style
verbosity = "medium"
