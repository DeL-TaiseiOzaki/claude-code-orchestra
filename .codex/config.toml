# Codex CLI Project Configuration
# This file enables project-specific Codex settings

# Default model configuration
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"

# Web search
web_search = "live"

# Approval policy
approval_policy = "never"

# Sandbox mode: default to danger-full-access so Codex can read/write anywhere
# on the filesystem and reach the network without a caller needing to pass
# --sandbox on every invocation (2026-07-21 decision, supersedes the
# 2026-07-18 workspace-write default -- see TEMPLATE_DESIGN_LOG.md). Combined
# with approval_policy = "never" below, this means Codex runs fully
# unattended with no sandbox and no confirmation prompts. Planning/review
# consultations should still pass an explicit `--sandbox read-only` flag to
# avoid accidental writes during read-only tasks. Completion verification
# (Sol Guardrails, root AGENTS.md section "Guardrails (Completion
# Verification)") remains mandatory regardless of sandbox mode.
sandbox_mode = "danger-full-access"

# Feature toggles
[features]
skills = true

# Enabled project skills. Deliberately short: most skills under
# .claude/skills/ are Claude-lead orchestration whose steps invoke Claude
# Code's Task tool with a `subagent_type` (feature, spike, team-execute,
# troubleshoot, plan, tdd, simplify, catchup, research-lib, codex-system).
# Codex cannot execute those steps, so enabling them here would hand it a
# procedure that stalls partway through. The two below are runtime-neutral:
# both are plain file reads and a guarded write through a shared script.
# init and checkpointing are also runtime-neutral but belong to the main
# agent's session bookkeeping, not to a delegated Tier 2 run.
[[skills.config]]
enabled = true
path = ".claude/skills/context-loader"

[[skills.config]]
enabled = true
path = ".claude/skills/design-tracker"

# Response style
verbosity = "medium"
